name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - run: unzip -q JarvisAI-project.zip
      - run: cd JarvisAI && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: JarvisAI-apk
          path: JarvisAI/app/build/outputs/apk/debug/app-debug.apk
